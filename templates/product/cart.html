<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6 font-sans">
    <h1 class="text-3xl sm:text-4xl font-bold text-center text-gray-900 mb-8">Your Shopping Cart</h1>
    
    <div class="space-y-6 max-w-4xl mx-auto" id="cart-container">
    {% for item in cart %}
        <div class="cart-item flex flex-col sm:flex-row items-center justify-between bg-white shadow rounded-xl p-4 border border-gray-200 gap-4">
     
        <div class="flex items-center gap-4 sm:w-1/3 w-full">
            <img src="{{item.image.url}}" alt="" class="w-20 h-20 object-cover rounded-lg">
             <h3 class="text-base sm:text-lg font-medium text-gray-800">{{item.name}}</h3>
        </div>
        <div class=" flex items-center justify-center ">
            <button class="qty-btn bg-gray-200 px-2 py-1 rounded hover:bg-gray-300" aria-label="Decrease Quantity">−</button>
            <input type="number" name="" value="{{item.quantity}}" min="1" class="quantity-input w-14 text-center border rounded text-sm bg-gray-100 ">
            <button class="qty-btn bg-gray-200 px-2 py-1 rounded hover:bg-gray-300" aria-label="Increase Quantity">+</button>
        </div>
        
        <div class=" flex items-center justify-center ">
            <h3>₹{{item.price}}</h3>
        </div>
        
        <div class="sm:w-1/6 w-full flex justify-center">
        
                <a href="{% url 'remove_item' item.id %}" class="flex items-center gap-1 px-3 py-1 text-white bg-red-600 hover:bg-red-700 rounded text-sm sm:text-base">Remove</a>
            
          </div>
    </div>
    {% endfor %}
    
    <div class="max-w-4xl mx-auto mt-10 text-right">
        <div class="inline-block bg-white shadow rounded-xl p-4 border text-lg sm:text-xl font-bold text-gray-900">
          Total: ₹<span id="cart-total">{{ total }}</span>
        </div>
      </div>
    </div>

    <!-- <table>
        {% for item in cart %}
        <tr class="p-10">
            
          H  <td>{{item.quantity}}</td>
            <td>{{item.price}}</td>
            <td><button class="bg-blue">Remove</button></td>
        </tr>
        {% endfor %}
    </table> -->
</body>

<script>

// change qauntity
document.querySelectorAll('.qty-btn').forEach(button => {
      button.addEventListener('click', (e) => {
        const input = e.target.parentElement.querySelector('input');
        const isAdd = e.target.textContent === '+';
        let val = parseInt(input.value) || 1;
        input.value = isAdd ? val + 1 : Math.max(1, val - 1);
        input.dispatchEvent(new Event('input'));
      });
    });


// update total
    document.querySelectorAll('.quantity-input').forEach(input => {
        console.log("input")
      input.addEventListener('input', () => {
        const cartItem = input.closest('.cart-item');
        const unitPrice = parseFloat(cartItem.dataset.price);
        const quantity = parseInt(input.value) || 1;
        const itemTotal = cartItem.querySelector('.item-total');
        itemTotal.textContent = (unitPrice * quantity).toFixed(2);
        console.log(unitPrice)
        let cartTotal = 0;
        document.querySelectorAll('.item-total').forEach(span => {
          cartTotal += parseFloat(span.textContent);
        });
        document.getElementById('cart-total').textContent = cartTotal.toFixed(2);
      });
    });
</script>
</html>
