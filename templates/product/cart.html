<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Shopping Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

  <h1 class="text-3xl md:4xl font-bold text-center text-gray-800 mb-12">Your Shopping Cart</h1>

  <div class="space-y-8 max-w-5xl mx-auto" id="cart-container">
    {% for item in cart %}
    <div class="cart-item group flex flex-col sm:flex-row items-center justify-between bg-white shadow-md hover:shadow-lg rounded-2xl p-6 transition-all border border-gray-200  sm:text-2xl">

      <div class="flex items-center gap-5 sm:w-1/3 w-full">
        <img src="{{item.image.url}}" alt="" class="w-24 h-24 object-cover rounded-xl">
        <div>
          <h3 class="text-base sm:text-lg font-medium text-gray-800">{{item.name}}</h3>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button class="qty-btn bg-gray-200 p-2 rounded-full hover:bg-gray-300 transition" aria-label="Decrease Quantity">−</button>
        <input type="number" value="{{item.quantity}}" min="1" class="quantity-input w-16 text-center border rounded-lg text-base bg-gray-50 focus:ring-2 focus:ring-indigo-300">
        <button class="qty-btn bg-gray-200 p-2 rounded-full hover:bg-gray-300 transition" aria-label="Increase Quantity">+</button>
      </div>

      <div class="flex items-center">
        <h3 class="text-xl font-semibold text-gray-700">₹<span class="item-total" data-price="{{item.price}}">{{item.price}}</span></h3>
      </div>

      <div class="sm:w-1/6 w-full flex justify-center">
        <a href="{% url 'remove_item' item.id %}" class="flex items-center gap-2 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition text-sm sm:text-base">
          Remove
        </a>
      </div>
    </div>
    {% endfor %}

    <div class="max-w-5xl mx-auto mt-12 text-right">
      <div class="inline-block bg-white shadow-md rounded-2xl p-6 border text-2xl font-bold text-gray-900">
        Total: ₹<span id="cart-total">{{ total }}</span>
      </div>
    </div>
  </div>

<script>
  // Quantity change handlers
  document.querySelectorAll('.qty-btn').forEach(button => {
  button.addEventListener('click', (e) => {
    const input = e.target.parentElement.querySelector('input');
    const isAdd = e.target.getAttribute('aria-label') === 'Increase Quantity';  // ← Fix: check aria-label
    let val = parseInt(input.value) || 1;
    input.value = isAdd ? val + 1 : Math.max(1, val - 1);
    input.dispatchEvent(new Event('input'));
  });
});


  // Update total dynamically
  document.querySelectorAll('.quantity-input').forEach(input => {
    input.addEventListener('input', () => {
      const cartItem = input.closest('.cart-item');
      const unitPrice = parseFloat(cartItem.querySelector('.item-total').dataset.price || cartItem.querySelector('.item-total').textContent);
      const quantity = parseInt(input.value) || 1;
      cartItem.querySelector('.item-total').textContent = (unitPrice * quantity).toFixed(2);

      let cartTotal = 0;
      document.querySelectorAll('.item-total').forEach(span => {
        cartTotal += parseFloat(span.textContent);
      });
      document.getElementById('cart-total').textContent = cartTotal.toFixed(2);
    });
  });
</script>

</body>
</html>
