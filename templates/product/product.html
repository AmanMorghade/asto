{% load static %}
{% csrf_token %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-b from-blue-50 via-blue-100 to-white
 min-h-screen p-5 relative">

<!-- Cart Button -->
<div class="fixed top-5 right-5 bg-blue-600 text-white  lg:text-xl sm:text-3xl p-3 rounded-full cursor-pointer shadow-lg z-50" onclick="toggleModal()">
  🛒 <span id="cart-count" class="font-bold">{{ cart_count }}</span>
</div>

<!-- Cart Modal -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-white rounded-2xl shadow-2xl w-[70%] md:w-[70%] lg:h-5/6 md:h-1/2 sm:h-1/2 relative">
    <button onclick="toggleModal()" class="absolute top-3 right-4 text-gray-400 hover:text-black text-2xl">&times;</button>
    <iframe src="{% url 'cart_list' %}" class="w-full h-full rounded-b-2xl border-none"></iframe>
  </div>
</div>

<!-- Search Bar -->
<div class="flex justify-center mt-8 mb-8">
  <input type="text" id="search-bar" placeholder="Search for products..." 
    class="w-full sm:w-8/12 md:w-5/12 p-3 rounded-full border-2 border-blue-300 shadow focus:ring-4 focus:ring-blue-300 focus:outline-none text-base sm:text-2xl"
    onkeyup="searchProducts()">
</div>

<!-- Products Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 px-4" id="product-grid">
  {% for product in products %}
  <div class="product-card bg-white rounded-xl shadow-md hover:shadow-lg hover:scale-[1.02] transition-transform overflow-hidden flex flex-col">

    <!-- Product Image -->
    <div class="relative h-40 md:h-44 overflow-hidden">
      <img src="{{ product.image.url }}" alt="{{ product.name }}" class="object-cover lg:h-40 sm:h-52 w-auto mx-auto block" loading="lazy">
      <div class="absolute top-2 left-2 bg-green-500 text-white lg:text-sm sm:text-2xl  font-bold px-2 py-1 rounded-full shadow">
        ₹{{ product.price }}
      </div>
    </div>

    <!-- Product Details -->
    <div class="p-3 text-center flex flex-col flex-1">
      <h3 class="lg:text-lg sm:text-3xl font-bold text-blue-900 mb-2">{{ product.name }}</h3>
      <p class="lg:text-base sm:text-2xl text-gray-600 mb-4">{{ product.description|truncatewords:10 }}</p>

      <a href="{% url 'cart' product.id %}" class="mt-auto">
        <button class="w-full bg-blue-600 text-white px-5 py-3 rounded-lg lg:text-base sm:text-2xl font-semibold transition-transform duration-200 hover:scale-105 hover:bg-blue-800">
          🛒 Add to Cart
        </button>
      </a>
    </div>

  </div>
  {% endfor %}
</div>

<!-- Modal Toggle Script -->
<script>
function toggleModal() {
  const modal = document.getElementById('modal');
  modal.classList.toggle('hidden');
}

document.addEventListener('keydown', function(event) {
  if (event.key === "Escape") {
    const modal = document.getElementById('modal');
    if (!modal.classList.contains('hidden')) {
      modal.classList.add('hidden');
    }
  }
});

function searchProducts() {
  const input = document.getElementById('search-bar').value.toLowerCase();
  const products = document.getElementsByClassName('product-card');

  for (let i = 0; i < products.length; i++) {
    const productName = products[i].querySelector('h3').textContent.toLowerCase();
    
    if (productName.includes(input)) {
      products[i].style.display = 'flex'; // your cards use flex, not block
    } else {
      products[i].style.display = 'none';
    }
  }
}
</script>

</body>
</html>
