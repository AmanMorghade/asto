{% load static %}
{% csrf_token %}

<div id="home">
  <header class="relative min-h-screen flex items-center justify-center text-center text-white overflow-hidden">
    
    <!-- Background Video -->
    <video autoplay loop muted class="absolute top-0 left-0 w-full h-full object-cover brightness-50">
      <source src="/media/video.mp4" type="video/mp4" />
    </video>

    <!-- Form Container -->
    <form action="{% url 'book_appointment' %}" method="post"
      class="backdrop-blur-md bg-white/20 border border-white/30 shadow-2xl rounded-3xl px-8 py-4 w-11/12 sm:w-3/4 md:w-1/2 lg:w-1/3 z-10 lg:my-16">

      {% csrf_token %}

      <h2 class="text-3xl font-bold text-white mb-6">Book Appointment</h2>

      <div class="mb-4">
        <input type="text" id="name" name="name" placeholder="Your Name" required
          class="w-full p-3 rounded-xl border-none outline-none bg-white/30 text-white placeholder-white focus:ring-4 focus:ring-blue-400 transition" />
      </div>

      <div class="mb-4">
        <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" required pattern="^[0-9]{10}$"
          class="w-full p-3 rounded-xl border-none outline-none bg-white/30 text-white placeholder-white focus:ring-4 focus:ring-blue-400 transition" />
      </div>

      <div class="flex flex-col sm:flex-row gap-4 mb-4">
        <input type="text" id="dob" name="dob" placeholder="Date of Birth" required onfocus="this.type='date'"
          class="w-full p-3 rounded-xl border-none outline-none bg-white/30 text-white placeholder-white focus:ring-4 focus:ring-blue-400 transition" />
        <input type="text" id="time" name="time" placeholder="Birth Time" required onfocus="this.type='time'"
          class="w-full p-3 rounded-xl border-none outline-none bg-white/30 text-white placeholder-white focus:ring-4 focus:ring-blue-400 transition" />
      </div>

      <div class="mb-4">
        <input type="text" id="place" name="place" placeholder="Birth Place" required
          class="w-full p-3 rounded-xl border-none outline-none bg-white/30 text-white placeholder-white focus:ring-4 focus:ring-blue-400 transition" />
      </div>

      <div class="mb-4">
        <select id="gender" name="gender" required
          class="w-full p-3 rounded-xl bg-white/30 text-white placeholder-white border-none focus:ring-4 focus:ring-blue-400 outline-none transition">
          <option value="" disabled selected>Select Gender</option>
          <option value="Male" class="text-black">Male</option>
          <option value="Female" class="text-black">Female</option>
          <option value="Other" class="text-black">Other</option>
        </select>
      </div>

      <!-- Service Dropdown -->
      <div class="mb-4 relative">
        <button type="button" id="dropdownButton"
          class="w-full p-3 rounded-xl bg-white/30 text-white text-left flex justify-between items-center focus:ring-4 focus:ring-blue-400 transition"
          onclick="toggleDropdown()">
          <span id="selectedService">Select a Service</span>
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <ul id="dropdownMenu"
          class="absolute w-full bg-white/90 text-gray-800 rounded-xl shadow-lg mt-2 hidden z-20 backdrop-blur-md">
          <li><a href="#" class="block px-4 py-2 hover:bg-blue-100 rounded-lg" onclick="updateDropdown(this)">Birth Chart Reading</a></li>
          <li><a href="#" class="block px-4 py-2 hover:bg-blue-100 rounded-lg" onclick="updateDropdown(this)">Kundali Milan</a></li>
          <li><a href="#" class="block px-4 py-2 hover:bg-blue-100 rounded-lg" onclick="updateDropdown(this)">Numerology</a></li>
          <li><a href="#" class="block px-4 py-2 hover:bg-blue-100 rounded-lg" onclick="updateDropdown(this)">Vastu</a></li>
        </ul>
      </div>

      <input type="hidden" id="service" name="service">

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-2xl font-bold text-lg transition">
        Book Appointment
      </button>

    </form>

    <!-- JavaScript -->
    <script>
      function toggleDropdown() {
        document.getElementById("dropdownMenu").classList.toggle("hidden");
      }

      function updateDropdown(element) {
        document.getElementById("selectedService").innerText = element.innerText;
        document.getElementById("service").value = element.innerText; // Set value for form
        document.getElementById("dropdownMenu").classList.add("hidden");
      }

      // Close dropdown when clicking outside
      document.addEventListener("click", function (event) {
        if (!document.getElementById("dropdownButton").contains(event.target)) {
          document.getElementById("dropdownMenu").classList.add("hidden");
        }
      });
    </script>

  </header>
</div>
